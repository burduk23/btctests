<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BTC Alarm</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <div id="toast-container"></div>

    <div id="tabs-container" class="tabs">
        <div id="tab-user" class="tab active" onclick="switchTab('user')">Мои адреса</div>
        <div id="tab-chat" class="tab" onclick="switchTab('chat')">Чат</div>
        <div id="tab-admin" class="tab hidden" onclick="switchTab('admin')">Админ</div>
    </div>

    <!-- USER ADDRESSES VIEW -->
    <div id="view-user" class="view-section">
        <div class="scrollable">
            <h3>🎨 Тема оформления</h3>
            <div class="group" style="margin-top:0; margin-bottom: 20px; display: flex; gap: 8px;">
                <button class="btn-small outline" onclick="setTheme('default')">Авто</button>
                <button class="btn-small outline" onclick="setTheme('dark')">Тёмная</button>
                <button class="btn-small outline" onclick="setTheme('cyberpunk')">Киберпанк</button>
            </div>

            <h3>📂 Ваши адреса</h3>
            <div id="user-list" class="list">
                <div class="empty-state">Загрузка...</div>
            </div>

            <h3>➕ Добавить новый адрес</h3>
            <div class="group" style="margin-top:0;">
                <input type="text" id="name" placeholder="Название (напр.: Основной)">
                <input type="text" id="address" placeholder="BTC адрес">
                <button onclick="addAddress()">Добавить адрес</button>
            </div>
        </div>
    </div>

    <!-- CHAT VIEW (For Both Admin and User) -->
    <div id="view-chat" class="view-section hidden" style="background: var(--bg-color);">
        <!-- Admin Chat List -->
        <div id="chat-list-container" class="chat-list hidden">
            <!-- Populated via JS -->
        </div>

        <!-- Single Conversation (Fullscreen overlay inside the view) -->
        <div id="chat-conversation" class="chat-conversation hidden">
            <div class="chat-header">
                <button class="back-btn" id="chat-back-btn" onclick="closeChat()">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                </button>
                <div class="avatar" id="chat-header-avatar" style="background: #ccc;">?</div>
                <div class="chat-header-info">
                    <div class="chat-header-name" id="chat-header-name">Загрузка...</div>
                    <div class="chat-header-status" id="chat-header-status">...</div>
                </div>
            </div>
            <div class="messages-container" id="chat-messages">
                <!-- Messages -->
            </div>
            <div class="input-area">
                <input type="text" id="chat-input" placeholder="Сообщение..." onkeypress="handleChatKeyPress(event)">
                <button onclick="sendChatMessage()">
                    <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                </button>
            </div>
        </div>
    </div>

    <!-- ADMIN VIEW -->
    <div id="view-admin" class="view-section hidden">
        <div class="scrollable">
            <h3>Рассылка сообщений</h3>
            <div class="group" style="margin-top:0;">
                <div class="broadcast-users" id="broadcast-users-list">
                    <!-- Checkboxes -->
                </div>
                <button class="outline btn-small" onclick="selectAllUsers()" style="margin-bottom:8px;">Выбрать всех</button>
                <textarea id="broadcast-text" placeholder="Текст рассылки..."></textarea>
                <button class="green" onclick="sendBroadcast()">Отправить рассылку</button>
            </div>

            <h3>Управление пользователями</h3>
            <div id="admin-list" class="list">
                <div class="empty-state">Загрузка...</div>
            </div>
            
            <h3>➕ Добавить адрес пользователю</h3>
            <div class="group" style="margin-top:0;">
                <input type="text" id="admin-uid" placeholder="ID пользователя">
                <input type="text" id="admin-name" placeholder="Название группы">
                <input type="text" id="admin-address" placeholder="BTC адрес">
                <button onclick="adminAddAddress()">Добавить пользователю</button>
            </div>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
